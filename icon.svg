<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLicit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glowLicit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgLicit)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Grade de Fluxo / Linhas de Timeline Sutis -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="2" />

  <!-- Escudo de Governança e Integridade (CBMBA / 14.133) -->
  <g filter="url(#glowLicit)">
    <path d="M 256 100 L 375 145 C 375 260 325 350 256 405 C 187 350 137 260 137 145 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round" />

    <!-- Traço de Fluxo Contínuo / Cronômetro Preclusivo (L e F estilizados) -->
    <!-- Coluna de Prazos -->
    <rect x="200" y="180" width="22" height="150" rx="11" fill="url(#flowGrad)" />
    <!-- Barras de Estágios da Fase Preparatória ao PNCP -->
    <rect x="200" y="180" width="105" height="22" rx="11" fill="#38bdf8" />
    <rect x="200" y="240" width="80" height="20" rx="10" fill="#818cf8" />
    <rect x="200" y="300" width="112" height="22" rx="11" fill="url(#flowGrad)" />

    <!-- Nó de Decisão / Checkpoint em Tempo Real -->
    <circle cx="340" cy="311" r="16" fill="#10b981" />
    <circle cx="340" cy="311" r="24" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6" />
    <path d="M 334 311 L 338 315 L 347 306" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
