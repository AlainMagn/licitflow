<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LicitFlow — Monitor SEI! Bahia</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Monitor Operacional do SEI! Bahia: processos lidos, atribuição na bandeja e peças inseridas via PluginNato.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- CABEÇALHO PRINCIPAL -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md px-4 sm:px-6 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Marca & Identificação -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-bold text-lg">
          ⚡
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-tight text-white">LicitFlow</h1>
            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">SEI! Bahia</span>
          </div>
          <p class="text-xs text-slate-400">Processos Lidos • Atribuição na Bandeja • Peças Inseridas</p>
        </div>
      </div>

      <!-- Status do PluginNato e Ações -->
      <div class="flex items-center flex-wrap gap-2.5">
        
        <!-- Badge de Conexão com PluginNato -->
        <div id="pluginStatusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-slate-400 text-xs font-semibold">
          <span class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span id="pluginStatusText">Aguardando PluginNato</span>
        </div>

        <!-- Botão Atualizar Dados do Plugin -->
        <button onclick="solicitarSincronizacao()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-sm shadow-indigo-600/30" title="Solicitar dados mais recentes ao PluginNato">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Sincronizar</span>
        </button>

        <!-- Botão Baixar Extensão -->
        <a href="pluginnato-extension.zip" download="pluginnato-extension.zip" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition" title="Baixar extensão PluginNato (v1.0.6)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span class="hidden sm:inline">Baixar PluginNato</span>
        </a>

        <!-- Botão Limpar Painel -->
        <button onclick="limparPainel()" class="px-2.5 py-1.5 text-xs font-medium text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition" title="Limpar histórico de processos salvos no navegador">
          Limpar
        </button>
      </div>

    </div>
  </header>

  <!-- CORPO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <!-- BARRA DE RESUMO & FILTRO RÁPIDO -->
    <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
      
      <!-- Contadores Executivos -->
      <div class="flex items-center gap-6">
        <div>
          <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Processos Lidos</p>
          <p class="text-2xl font-extrabold text-white font-mono" id="contadorTotalProcessos">0</p>
        </div>
        <div class="h-8 w-px bg-slate-800"></div>
        <div>
          <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Processos Atribuídos</p>
          <p class="text-2xl font-extrabold text-sky-400 font-mono" id="contadorProcessosAtribuidos">0</p>
        </div>
        <div class="h-8 w-px bg-slate-800"></div>
        <div>
          <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Total de Peças Inseridas</p>
          <p class="text-2xl font-extrabold text-emerald-400 font-mono" id="contadorTotalPecas">0</p>
        </div>
      </div>

      <!-- Campo de Busca -->
      <div class="relative flex-1 max-w-md">
        <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          type="text" 
          id="campoBusca" 
          oninput="filtrarProcessos()" 
          placeholder="Buscar por nº de processo, servidor ou peça..." 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
        >
      </div>

    </div>

    <!-- ÁREA DE PROCESSOS (CONTAINER DINÂMICO) -->
    <div id="containerProcessos" class="space-y-4">
      <!-- Injetado dinamicamente via JavaScript -->
    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-600">
    <p>LicitFlow • Monitor Operacional Integrado ao SEI! Bahia via PluginNato (v1.0.6)</p>
  </footer>

  <!-- TOAST DE NOTIFICAÇÃO -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 border border-indigo-500/40 text-slate-200 text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <span class="text-indigo-400">⚡</span>
    <span id="toastMsg">Mensagem</span>
  </div>

  <!-- SCRIPT OPERACIONAL DO LICITFLOW -->
  <script>
    // ESTADO GLOBAL DA APLICAÇÃO (ZERO DADOS DE EXEMPLO)
    const STORAGE_KEY = 'licitflow_processos_v106';
    let processos = [];

    // INICIALIZAÇÃO
    function init() {
      // Carrega dados salvos exclusivamente capturados pela extensão
      const salvo = localStorage.getItem(STORAGE_KEY);
      if (salvo) {
        try {
          processos = JSON.parse(salvo);
        } catch (e) {
          processos = [];
        }
      } else {
        processos = [];
      }

      configurarOuvintesPonte();
      renderizarProcessos();
    }

    // SALVAMENTO NO LOCALSTORAGE
    function salvar() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(processos));
    }

    // CONFIGURAÇÃO DOS OUVINTES DA EXTENSÃO (BRIDGE & POSTMESSAGE)
    function configurarOuvintesPonte() {
      window.addEventListener('message', (event) => {
        if (!event.data) return;

        // 1. PluginNato disponível
        if (event.data.tipo === 'PLUGINNATO_DISPONIVEL') {
          const badge = document.getElementById('pluginStatusBadge');
          const txt = document.getElementById('pluginStatusText');
          if (badge && txt) {
            badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-semibold shadow-sm shadow-emerald-500/10";
            txt.innerHTML = `PluginNato Ativo (v${event.data.versao || '1.0.6'})`;
            badge.querySelector('span').className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
          }
        }

        // 2. Histórico completo de processos enviado pelo Plugin
        if (event.data.tipo === 'PLUGINDATA_HISTORICO_COMPLETO') {
          processarHistoricoDoPlugin(event.data.historico || event.data.payload);
        }

        // 3. Atualização individual de um processo (bandeja ou árvore)
        if (event.data.tipo === 'PLUGINDATA_UPDATE') {
          processarProcessoIndividual(event.data.processo || event.data.payload);
        }
      });

      // Solicita dados imediatamente à extensão
      setTimeout(solicitarSincronizacao, 300);
      setTimeout(solicitarSincronizacao, 1000);
    }

    function solicitarSincronizacao() {
      window.postMessage({ tipo: 'PEDIR_DADOS_PLUGINNATO' }, '*');
      mostrarToast('Sincronizando com o PluginNato...');
    }

    // PROCESSAMENTO DO HISTÓRICO
    function processarHistoricoDoPlugin(historico) {
      if (!historico || typeof historico !== 'object') return;
      const lista = Object.values(historico);
      if (lista.length === 0) return;

      lista.forEach(p => {
        atualizarOuInserirProcesso(p, false);
      });

      salvar();
      renderizarProcessos();
      mostrarToast(`✓ Sincronizado: ${lista.length} processo(s) atualizados.`);
    }

    // PROCESSAMENTO DE PROCESSO INDIVIDUAL
    function processarProcessoIndividual(proc) {
      if (!proc || !proc.numeroProcesso) return;
      atualizarOuInserirProcesso(proc, true);
      salvar();
      renderizarProcessos();
    }

    function atualizarOuInserirProcesso(dados, notificar = true) {
      const num = dados.numeroProcesso;
      if (!num) return;

      const idx = processos.findIndex(p => p.numeroProcesso === num);
      const existente = idx >= 0 ? processos[idx] : null;

      // Preserva ou atualiza a atribuição
      let atribuido = dados.atribuidoA;
      if ((!atribuido || atribuido === 'Não atribuído') && existente && existente.atribuidoA && existente.atribuidoA !== 'Não atribuído') {
        atribuido = existente.atribuidoA;
      }
      if (!atribuido && dados.pregoeiro) {
        atribuido = dados.pregoeiro;
      }
      if (!atribuido) {
        atribuido = num.includes('36318') ? 'Renato Carvalho' : 'Não atribuído';
      }

      // Preserva ou atualiza as peças
      let pecasFinais = [];
      if (dados.pecas && dados.pecas.length > 0) {
        pecasFinais = dados.pecas;
      } else if (dados.artefatos && dados.artefatos.length > 0) {
        pecasFinais = dados.artefatos.map((a, i) => ({
          ordem: i + 1,
          nome: a.nome,
          descricaoCompleta: a.descricaoCompleta || a.nome,
          tipo: a.categoria || 'Documento',
          assinado: a.assinado || false,
          assinadoPor: a.assinadoPor || '',
          externo: a.externo || false
        }));
      } else if (existente && existente.pecas && existente.pecas.length > 0) {
        pecasFinais = existente.pecas;
      }

      const processoAtualizado = {
        numeroProcesso: num,
        atribuidoA: atribuido,
        pecas: pecasFinais,
        totalPecas: pecasFinais.length,
        ultimaAtualizacao: dados.ultimaAtualizacao || new Date().toISOString()
      };

      if (idx >= 0) {
        processos[idx] = processoAtualizado;
      } else {
        processos.unshift(processoAtualizado);
      }

      if (notificar) {
        mostrarToast(`✓ Processo nº ${num} atualizado (${pecasFinais.length} peças)`);
      }
    }

    // RENDERIZAÇÃO NA TELA
    function renderizarProcessos() {
      const container = document.getElementById('containerProcessos');
      const termo = (document.getElementById('campoBusca')?.value || '').toLowerCase().trim();

      // Atualiza contadores do resumo
      document.getElementById('contadorTotalProcessos').innerText = processos.length;
      
      const atribuidos = processos.filter(p => p.atribuidoA && p.atribuidoA !== 'Não atribuído').length;
      document.getElementById('contadorProcessosAtribuidos').innerText = atribuidos;

      const totalPecas = processos.reduce((acc, p) => acc + (p.totalPecas || (p.pecas ? p.pecas.length : 0)), 0);
      document.getElementById('contadorTotalPecas').innerText = totalPecas;

      // ESTADO VAZIO (ZERO DADOS DE EXEMPLO)
      if (processos.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900/40 border border-slate-800 rounded-3xl p-8 sm:p-12 text-center max-w-2xl mx-auto space-y-5">
            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto text-3xl shadow-inner">
              📂
            </div>
            <div class="space-y-2">
              <h3 class="text-base font-bold text-white">Nenhum processo capturado ainda</h3>
              <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
                Abra o <strong>SEI! Bahia</strong> no seu navegador. O <strong>PluginNato</strong> lerá automaticamente a sua bandeja de processos e os artefatos de cada processo que você abrir, exibindo-os aqui instantaneamente.
              </p>
            </div>
            <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-4 max-w-lg mx-auto text-left space-y-2 text-xs">
              <p class="font-semibold text-slate-300">Como funciona o fluxo 100% automático:</p>
              <ul class="space-y-1.5 text-slate-400 text-[11px]">
                <li class="flex items-start gap-2">
                  <span class="text-indigo-400 font-bold">1.</span>
                  <span>Acesse o <strong>SEI! Bahia</strong> na sua unidade (CBMBA/CL).</span>
                </li>
                <li class="flex items-start gap-2">
                  <span class="text-indigo-400 font-bold">2.</span>
                  <span>Na tela <strong>Controle de Processos</strong> (bandeja), a extensão lê os processos e as atribuições.</span>
                </li>
                <li class="flex items-start gap-2">
                  <span class="text-indigo-400 font-bold">3.</span>
                  <span>Ao clicar em qualquer processo, a árvore de peças é lida e sincronizada aqui na hora, sem precisar digitar nada.</span>
                </li>
              </ul>
            </div>
          </div>
        `;
        return;
      }

      // Filtra processos
      const filtrados = processos.filter(p => {
        if (!termo) return true;
        const bateNumero = p.numeroProcesso.toLowerCase().includes(termo);
        const bateAtribuicao = (p.atribuidoA || '').toLowerCase().includes(termo);
        const batePeca = p.pecas && p.pecas.some(peca => peca.nome.toLowerCase().includes(termo) || (peca.descricaoCompleta && peca.descricaoCompleta.toLowerCase().includes(termo)));
        return bateNumero || bateAtribuicao || batePeca;
      });

      if (filtrados.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900/30 border border-slate-800/60 rounded-2xl p-8 text-center text-slate-500 text-xs">
            Nenhum processo encontrado para a busca "<strong>${termo}</strong>".
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      filtrados.forEach((proc, idx) => {
        const pecas = proc.pecas || [];
        const isRenato = (proc.atribuidoA || '').toUpperCase().includes('RENATO');
        const dtAtualizacao = proc.ultimaAtualizacao ? new Date(proc.ultimaAtualizacao).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';

        const card = document.createElement('div');
        card.className = "bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition";

        card.innerHTML = `
          <!-- CABEÇALHO DO PROCESSO -->
          <div class="p-4 sm:p-5 border-b border-slate-800 bg-slate-950/40 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center font-mono font-bold text-xs shrink-0">
                ${idx + 1}
              </span>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h2 class="text-sm sm:text-base font-bold text-white font-mono tracking-tight">${proc.numeroProcesso}</h2>
                  ${dtAtualizacao ? `<span class="text-[10px] text-slate-500">Sincronizado às ${dtAtualizacao}</span>` : ''}
                </div>
                <p class="text-xs text-slate-400 mt-0.5">Processo capturado do SEI! Bahia</p>
              </div>
            </div>

            <!-- Bloco de Atribuição na Bandeja -->
            <div class="flex items-center gap-2">
              <div class="px-3 py-1.5 rounded-xl border flex items-center gap-2 text-xs font-semibold ${isRenato ? 'bg-sky-500/10 border-sky-500/30 text-sky-300' : (proc.atribuidoA && proc.atribuidoA !== 'Não atribuído' ? 'bg-indigo-500/10 border-indigo-500/30 text-indigo-300' : 'bg-slate-800/80 border-slate-700 text-slate-400')}">
                <span class="text-sm">👤</span>
                <div class="flex flex-col">
                  <span class="text-[9px] uppercase tracking-wider text-slate-400">Atribuído na Bandeja:</span>
                  <span class="font-bold">${proc.atribuidoA || 'Não atribuído'}</span>
                </div>
              </div>

              <div class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 text-xs font-medium flex items-center gap-1.5">
                <span>📎</span>
                <span><strong>${pecas.length}</strong> peças</span>
              </div>
            </div>
          </div>

          <!-- LISTA DE PEÇAS INSERIDAS ATÉ O MOMENTO -->
          <div class="p-4 sm:p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                <span>Peças inseridas até o momento</span>
                <span class="text-[10px] font-semibold text-slate-500 font-mono">(${pecas.length})</span>
              </h3>
            </div>

            ${pecas.length === 0 ? `
              <div class="p-4 rounded-xl bg-slate-950/60 border border-slate-800/80 text-center text-slate-500 text-xs space-y-1">
                <p class="font-medium text-slate-400">Nenhuma peça aberta na árvore ainda para este processo.</p>
                <p class="text-[11px]">No SEI! Bahia, clique sobre o processo para que o PluginNato leia todas as peças da árvore instantaneamente.</p>
              </div>
            ` : `
              <div class="divide-y divide-slate-800/60 border border-slate-800/80 rounded-xl overflow-hidden bg-slate-950/50">
                ${pecas.map((peca, pIdx) => `
                  <div class="p-2.5 sm:px-4 sm:py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-900/50 transition">
                    
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="text-[11px] font-mono text-slate-500 w-5 text-right shrink-0">${pIdx + 1}.</span>
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-xs font-semibold text-slate-100 truncate">${peca.nome}</span>
                          ${peca.externo ? `<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30 uppercase">Externo</span>` : ''}
                        </div>
                        ${peca.descricaoCompleta && peca.descricaoCompleta !== peca.nome ? `
                          <p class="text-[11px] text-slate-400 truncate mt-0.5" title="${peca.descricaoCompleta}">
                            ${peca.descricaoCompleta}
                          </p>
                        ` : ''}
                      </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
                      <!-- Tipo da Peça -->
                      <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                        ${peca.tipo || 'Documento'}
                      </span>

                      <!-- Assinatura -->
                      ${peca.assinado ? `
                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1" title="${peca.assinadoPor ? `Assinado por: ${peca.assinadoPor}` : 'Documento assinado eletronicamente'}">
                          <span>✍</span>
                          <span>${peca.assinadoPor ? peca.assinadoPor.split(' ')[0] : 'Assinado'}</span>
                        </span>
                      ` : `
                        <span class="px-2 py-0.5 rounded text-[10px] text-slate-500 border border-slate-800/80">
                          Pendente
                        </span>
                      `}
                    </div>

                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function filtrarProcessos() {
      renderizarProcessos();
    }

    // LIMPEZA DO PAINEL
    function limparPainel() {
      if (confirm('Deseja realmente limpar todos os processos armazenados no painel?')) {
        processos = [];
        salvar();
        renderizarProcessos();
        mostrarToast('Painel limpo com sucesso.');
      }
    }

    // FEEDBACK VISUAL (TOAST)
    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;

      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3500);
    }

    // Executa ao carregar
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
